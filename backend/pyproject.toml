[tool.poetry]
name = "restaurant-app-backend"
version = "0.1.0"
description = "Backend for Japanese Restaurant Information Application"
authors = ["Devin AI <devin-ai-integration[bot]@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.95.0"
uvicorn = "^0.21.1"
sqlalchemy = "^2.0.9"
alembic = "^1.10.3"
python-dotenv = "^1.0.0"
httpx = "^0.24.0"
aiosqlite = "^0.18.0"
pytest = "^7.3.1"
pytest-asyncio = "^0.21.0"

[tool.poetry.dev-dependencies]
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
