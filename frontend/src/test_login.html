<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    button {
      padding: 10px 15px;
      margin: 10px 0;
      cursor: pointer;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Login API Test</h1>
  <button id="testLogin">Test Login with testuser</button>
  <button id="checkToken">Check Stored Token</button>
  <button id="testMe">Test /me Endpoint</button>
  <button id="clearToken">Clear Token</button>
  
  <h2>Results:</h2>
  <pre id="results">Click a button to test...</pre>

  <script>
    document.getElementById('testLogin').addEventListener('click', async () => {
      const resultsElement = document.getElementById('results');
      resultsElement.textContent = 'Testing login...';
      
      try {
        const response = await fetch('https://localhost:8000/api/v1/auth/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            username: 'testuser',
            password: 'password123',
          }),
        });
        
        const responseText = await response.text();
        let resultText = `Status: ${response.status}\n`;
        
        try {
          const data = JSON.parse(responseText);
          resultText += `Response: ${JSON.stringify(data, null, 2)}\n`;
          
          if (data.access_token) {
            localStorage.setItem('token', data.access_token);
            resultText += 'Token stored in localStorage';
          }
        } catch (e) {
          resultText += `Response (not JSON): ${responseText}`;
        }
        
        resultsElement.textContent = resultText;
      } catch (error) {
        resultsElement.textContent = `Error: ${error.message}`;
      }
    });
    
    document.getElementById('checkToken').addEventListener('click', () => {
      const token = localStorage.getItem('token');
      document.getElementById('results').textContent = token 
        ? `Stored token: ${token}` 
        : 'No token found in localStorage';
    });
    
    document.getElementById('testMe').addEventListener('click', async () => {
      const resultsElement = document.getElementById('results');
      const token = localStorage.getItem('token');
      
      if (!token) {
        resultsElement.textContent = 'No token found. Please login first.';
        return;
      }
      
      resultsElement.textContent = 'Testing /me endpoint...';
      
      try {
        const response = await fetch('https://localhost:8000/api/v1/auth/me', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        const responseText = await response.text();
        let resultText = `Status: ${response.status}\n`;
        
        try {
          const data = JSON.parse(responseText);
          resultText += `Response: ${JSON.stringify(data, null, 2)}`;
        } catch (e) {
          resultText += `Response (not JSON): ${responseText}`;
        }
        
        resultsElement.textContent = resultText;
      } catch (error) {
        resultsElement.textContent = `Error: ${error.message}`;
      }
    });
    
    document.getElementById('clearToken').addEventListener('click', () => {
      localStorage.removeItem('token');
      document.getElementById('results').textContent = 'Token cleared from localStorage';
    });
  </script>
</body>
</html>
