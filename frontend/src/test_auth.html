<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    button {
      padding: 10px 15px;
      margin: 10px 0;
      cursor: pointer;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Authentication Test</h1>
  
  <div>
    <h2>Token from curl test:</h2>
    <pre id="token">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0dXNlciIsImV4cCI6MTc0NjI4NjQ2Nn0.CwEakdL0uPRXi6UAngeRgFUInK82idedBlcfxhX9rYA</pre>
    
    <button id="setToken">Set Token in localStorage</button>
    <button id="clearToken">Clear Token from localStorage</button>
    <button id="checkToken">Check Token in localStorage</button>
    <button id="goToHome">Go to Home Page</button>
    <button id="testMe">Test /me Endpoint</button>
  </div>
  
  <h2>Results:</h2>
  <pre id="results">Click a button to test...</pre>

  <script>
    document.getElementById('setToken').addEventListener('click', () => {
      const token = document.getElementById('token').textContent.trim();
      localStorage.setItem('token', token);
      document.getElementById('results').textContent = `Token set in localStorage: ${token}`;
    });
    
    document.getElementById('clearToken').addEventListener('click', () => {
      localStorage.removeItem('token');
      document.getElementById('results').textContent = 'Token cleared from localStorage';
    });
    
    document.getElementById('checkToken').addEventListener('click', () => {
      const token = localStorage.getItem('token');
      document.getElementById('results').textContent = token 
        ? `Token in localStorage: ${token}` 
        : 'No token found in localStorage';
    });
    
    document.getElementById('goToHome').addEventListener('click', () => {
      window.location.href = '/';
    });
    
    document.getElementById('testMe').addEventListener('click', async () => {
      const resultsElement = document.getElementById('results');
      const token = localStorage.getItem('token');
      
      if (!token) {
        resultsElement.textContent = 'No token found. Please set token first.';
        return;
      }
      
      resultsElement.textContent = 'Testing /me endpoint...';
      
      try {
        const response = await fetch('https://localhost:8000/api/v1/auth/me', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        const responseText = await response.text();
        let resultText = `Status: ${response.status}\n`;
        
        try {
          const data = JSON.parse(responseText);
          resultText += `Response: ${JSON.stringify(data, null, 2)}`;
        } catch (e) {
          resultText += `Response (not JSON): ${responseText}`;
        }
        
        resultsElement.textContent = resultText;
      } catch (error) {
        resultsElement.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
